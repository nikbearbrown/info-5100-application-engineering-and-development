  <text x="350" y="378" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A stolen database of digests does not tell the attacker the passwords.</text>
  <text x="350" y="396" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">It tells them only that a guess matches when re-hashing it lands on the same digest.</text>
