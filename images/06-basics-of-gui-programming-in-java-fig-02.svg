  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Hash Function Mechanism</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A one-way pipeline. The same input always yields the same digest. No reverse path exists.</text>

  <rect x="56" y="160" width="156" height="80" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="134" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">INPUT</text>
