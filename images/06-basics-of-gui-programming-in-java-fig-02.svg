  <text x="134" y="226" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">user's password</text>

  <path d="M 216 200 L 268 200" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

