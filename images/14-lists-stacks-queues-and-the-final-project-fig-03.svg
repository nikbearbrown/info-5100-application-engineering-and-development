  <title id="fig-title">Impression vs Evidence</title>
  <desc>A defense built on impressions sounds confident and dissolves under questioning. A defense built on evidence cites concrete artifacts — tests passing, traces captured, decisions documented — and stays standing when pressed.</desc>
