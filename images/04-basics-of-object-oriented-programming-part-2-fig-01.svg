<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">Symptom / Proximate / Root Diagnostic Hierarchy</title>
  <desc>Three levels of cause. The symptom is what the user sees. The proximate cause is the immediate code path that produced it. The root cause is the upstream design or assumption that made the proximate path inevitable.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="INFO 5100 Application Engineering and Development"
      book-slug="info-5100-application-engineering-and-development"
      chapter="04-basics-of-object-oriented-programming-part-2"
