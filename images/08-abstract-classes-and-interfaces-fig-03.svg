  <!-- File track -->
  <text x="40" y="294" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">FILE</text>
  <line x1="100" y1="282" x2="640" y2="282" stroke="#2a1a0e" stroke-width="2"/>

  <!-- Mutation event -->
  <line x1="220" y1="120" x2="220" y2="170" stroke="#2a1a0e" stroke-width="1"/>
