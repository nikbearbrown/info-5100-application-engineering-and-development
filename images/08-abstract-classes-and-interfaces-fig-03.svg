<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">Memory vs File Timeline — the Data-Loss Window</title>
  <desc>Two horizontal tracks across time. Memory updates immediately when the user mutates state. The file lags until the next save. The shaded window between mutation and save is the data-loss surface — a crash within it loses every change made since the last save.</desc>
