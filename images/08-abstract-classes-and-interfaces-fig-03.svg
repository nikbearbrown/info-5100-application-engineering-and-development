  <text x="220" y="186" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">b.checkOut()</text>

  <!-- Save event -->
  <line x1="500" y1="120" x2="500" y2="306" stroke="#2a1a0e" stroke-width="1"/>
  <circle cx="500" cy="146" r="5" fill="#2a1a0e"/>
