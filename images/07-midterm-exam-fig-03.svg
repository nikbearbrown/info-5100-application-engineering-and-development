  <line x1="416" y1="156" x2="604" y2="156" stroke="#FFFFFF" stroke-width="0.5"/>
  <text x="510" y="178" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#FFFFFF">abstract move()</text>
  <text x="510" y="196" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">one polymorphic call site</text>

