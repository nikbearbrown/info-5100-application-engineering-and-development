  <path d="M 510 204 L 510 244" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 560 204 L 590 244" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="400" y="250" width="64" height="50" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="432" y="270" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">Car</text>
  <text x="432" y="288" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">move()</text>

  <rect x="478" y="250" width="64" height="50" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="510" y="270" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">Bicycle</text>
  <text x="510" y="288" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">move()</text>

  <rect x="556" y="250" width="64" height="50" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="588" y="270" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">Board</text>
  <text x="588" y="288" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">move()</text>

  <rect x="478" y="332" width="64" height="50" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="510" y="352" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#545454">Scooter</text>
  <text x="510" y="370" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">move()</text>

  <text x="510" y="416" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#C8102E">add Scooter: write one class.</text>
  <text x="510" y="432" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">No edit to the call site.</text>
