<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">If-Else vs Polymorphic — Before and After</title>
  <desc>The if-else version branches on the vehicle type in one method. The polymorphic version dispatches to three subclasses, each holding its own move() implementation. Adding a new vehicle touches one new class in the polymorphic version; in the if-else version it touches the call site and every other call site like it.</desc>
