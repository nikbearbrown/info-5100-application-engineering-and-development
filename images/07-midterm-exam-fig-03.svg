  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">If-Else vs Polymorphic — Before and After</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The same behavior, two structures. One braces for change; the other invites it.</text>

  <line x1="350" y1="80" x2="350" y2="456" stroke="#2a1a0e" stroke-width="0.5"/>

  <text x="190" y="106" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">BEFORE — IF-ELSE</text>

  <rect x="80" y="124" width="220" height="320" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="190" y="148" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">void move(Vehicle v) {</text>
  <text x="100" y="172" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">if (v.type == CAR)</text>
  <text x="120" y="190" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">driveCar(v);</text>
  <text x="100" y="214" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">else if (v.type == BIKE)</text>
  <text x="120" y="232" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">pedalBike(v);</text>
  <text x="100" y="256" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">else if (v.type == BOARD)</text>
  <text x="120" y="274" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">push(v);</text>
  <text x="100" y="296" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">// add a SCOOTER?</text>
  <text x="100" y="314" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#C8102E">// → edit this method</text>
  <text x="100" y="332" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#C8102E">// and every other one</text>
  <text x="100" y="350" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#C8102E">// that branches on type</text>
  <text x="190" y="380" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">}</text>

  <text x="190" y="416" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">type-test bug surface</text>
  <text x="190" y="432" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">grows with every subtype</text>

  <text x="510" y="106" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">AFTER — POLYMORPHIC</text>

