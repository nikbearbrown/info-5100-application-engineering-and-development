  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">AI Audit Form</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Attach to any AI-assisted commit. Four answers; no skipping.</text>

  <rect x="80" y="100" width="540" height="68" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="100" y="124" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">1 · WHAT DID THE AI WRITE?</text>
  <text x="100" y="146" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">names the specific files, methods, or sections</text>
  <text x="100" y="162" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">"the controller for the checkout screen, lines 12–48"</text>

  <rect x="80" y="180" width="540" height="68" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="100" y="204" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">2 · WHAT PROMPT DID YOU GIVE?</text>
  <text x="100" y="226" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">paste the prompt verbatim</text>
  <text x="100" y="242" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">"a controller that wires checkoutBtn to call CheckoutService.run(isbn)…"</text>

  <rect x="80" y="260" width="540" height="68" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="100" y="284" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">3 · WHAT DID YOU CHANGE?</text>
  <text x="100" y="306" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">the modifications you made before committing</text>
  <text x="100" y="322" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">"removed two unused imports; renamed handler to handleCheckout()"</text>

  <rect x="80" y="340" width="540" height="48" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="100" y="362" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">4 · HOW DID YOU VERIFY IT?</text>
  <text x="100" y="382" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">tests run, traces inspected, evidence captured</text>

  <text x="350" y="412" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">An empty field is a missing defense.</text>
