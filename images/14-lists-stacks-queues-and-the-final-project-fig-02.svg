  <title id="fig-title">AI Audit Form</title>
  <desc>A four-field disclosure record that accompanies any AI-assisted code in the final project. Each field forces the student to articulate the boundary of AI assistance and the evidence of their own verification.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
