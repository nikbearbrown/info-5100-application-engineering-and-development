    <text x="396" y="400">t₃</text>
    <line x1="542" y1="376" x2="542" y2="384" stroke="#545454" stroke-width="0.75"/>
    <text x="542" y="400">t₄</text>
  </g>

  <text x="350" y="448" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">If you touch a field in the constructor (phase 1), it is null. initialize() exists exactly to escape that trap.</text>
