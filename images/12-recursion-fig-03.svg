  <text x="350" y="412" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">TIME →</text>

  <!-- Phase 1: Construction (null fields) -->
  <rect x="80" y="100" width="120" height="260" fill="#C8102E" stroke="#C8102E" stroke-width="1.5" opacity="0.92"/>
  <text x="140" y="124" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.08em">PHASE 1</text>
  <text x="140" y="148" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#FFFFFF">construct</text>
  <text x="140" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#FFFFFF">new Controller()</text>
  <text x="140" y="220" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.06em">@FXML FIELDS</text>
  <text x="140" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#FFFFFF">null</text>
  <text x="140" y="316" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#FFFFFF">⚠ do not use</text>
  <text x="140" y="332" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#FFFFFF">fields here</text>

  <!-- Phase 2: Injection -->
  <rect x="208" y="100" width="120" height="260" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="268" y="124" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">PHASE 2</text>
  <text x="268" y="148" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">inject</text>
  <text x="268" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">FXMLLoader wires</text>
  <text x="268" y="220" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.06em">@FXML FIELDS</text>
  <text x="268" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#2a1a0e">filling…</text>

  <!-- Phase 3: initialize() -->
  <rect x="336" y="100" width="120" height="260" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="396" y="124" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">PHASE 3</text>
  <text x="396" y="148" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">initialize()</text>
  <text x="396" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">runs once</text>
  <text x="396" y="220" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.06em">@FXML FIELDS</text>
  <text x="396" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#2a1a0e">populated</text>
  <text x="396" y="316" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">set up listeners,</text>
  <text x="396" y="332" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">load initial data here</text>

  <!-- Phase 4: Event-responsive -->
  <rect x="464" y="100" width="156" height="260" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="542" y="124" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">PHASE 4</text>
  <text x="542" y="148" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">running</text>
  <text x="542" y="170" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">user clicks happen</text>
  <text x="542" y="220" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.06em">@FXML FIELDS</text>
  <text x="542" y="248" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#2a1a0e">live</text>
  <text x="542" y="316" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">handlers fire on events</text>

  <!-- Phase tick marks on timeline -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#545454" text-anchor="middle">
    <line x1="140" y1="376" x2="140" y2="384" stroke="#545454" stroke-width="0.75"/>
    <text x="140" y="400">t₁</text>
