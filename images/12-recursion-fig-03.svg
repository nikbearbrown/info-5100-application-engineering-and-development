  <rect x="0" y="0" width="700" height="480" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Controller Lifecycle — Four Phases</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">@FXML fields are null in phase 1. Use them there and the program crashes.</text>

