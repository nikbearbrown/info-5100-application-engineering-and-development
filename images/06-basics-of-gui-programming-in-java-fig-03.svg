  <title id="fig-title">Login Flow Sequence</title>
  <desc>A five-swimlane sequence: user, login form, LoginManager, UserAccount, and hash function. Patron is deliberately absent — the domain object plays no role in login. The boolean result returns up the call chain.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="INFO 5100 Application Engineering and Development"
      book-slug="info-5100-application-engineering-and-development"
