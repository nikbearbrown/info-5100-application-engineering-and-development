  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Comparator: Inline Tangle vs Named Object</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The same sort, two structures. Only one has a name you can hand to someone else.</text>

  <line x1="350" y1="80" x2="350" y2="392" stroke="#2a1a0e" stroke-width="0.5"/>

  <text x="190" y="106" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">INLINE</text>

  <rect x="80" y="124" width="220" height="180" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="100" y="148" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">books.sort((a, b) -&gt;</text>
  <text x="100" y="168" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">  a.getYear() -</text>
  <text x="100" y="188" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">  b.getYear());</text>
  <text x="100" y="232" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">// elsewhere</text>
  <text x="100" y="252" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">other.sort((a, b) -&gt;</text>
  <text x="100" y="272" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">  a.getYear() -</text>
  <text x="100" y="292" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">  b.getYear());</text>

  <text x="190" y="332" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">no name, no reuse</text>
  <text x="190" y="350" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">copy-paste to swap; tests sit nowhere</text>

  <text x="510" y="106" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#C8102E" letter-spacing="0.08em">NAMED OBJECT</text>

  <rect x="400" y="124" width="220" height="80" fill="#C8102E" stroke="#C8102E" stroke-width="1.5"/>
  <text x="510" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#FFFFFF">BY_YEAR</text>
  <line x1="416" y1="154" x2="604" y2="154" stroke="#FFFFFF" stroke-width="0.5"/>
  <text x="510" y="174" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#FFFFFF">Comparator&lt;Book&gt;</text>
  <text x="510" y="192" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">one definition, many calls</text>

