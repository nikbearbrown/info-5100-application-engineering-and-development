  <rect x="400" y="236" width="220" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="510" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">books.sort(BY_YEAR);</text>

  <rect x="400" y="280" width="220" height="36" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="510" y="302" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">other.sort(BY_YEAR);</text>

  <text x="510" y="346" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#C8102E">behavior is an object now</text>
  <text x="510" y="362" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">named, reusable, testable, swappable</text>
