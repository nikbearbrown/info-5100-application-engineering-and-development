  <title id="fig-title">Comparator: Inline Tangle vs Named Object</title>
  <desc>The inline comparator buries the sorting rule inside the call site — it has no name, no reuse, no test surface. The named comparator pulls the rule into its own object that can be passed around, named, swapped, and verified.</desc>
