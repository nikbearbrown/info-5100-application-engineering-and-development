  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Three-Layer Stack with Controller Seam</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A view never reaches into a model directly. The controller is the only seam.</text>

  <rect x="120" y="100" width="460" height="76" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="124" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">LAYER 3 — VIEW</text>
  <text x="350" y="146" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">FXML scene graph, button labels, table cells</text>
  <text x="350" y="164" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">never queries the Model directly</text>

  <rect x="120" y="180" width="460" height="60" fill="#C8102E" stroke="#C8102E" stroke-width="1.5"/>
  <text x="350" y="204" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.08em">LAYER 2 — CONTROLLER (THE SEAM)</text>
  <text x="350" y="226" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#FFFFFF">handles events; reads &amp; writes to the Model</text>

  <rect x="120" y="244" width="460" height="76" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="268" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">LAYER 1 — MODEL</text>
  <text x="350" y="290" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">Book, Patron, Catalog, Loan</text>
  <text x="350" y="308" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">domain objects; no awareness of UI</text>

  <text x="350" y="368" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">When a label needs a value from the Model, the controller fetches it.</text>
  <text x="350" y="386" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">When a click changes state, the controller writes. That is the entire boundary.</text>
</svg>
