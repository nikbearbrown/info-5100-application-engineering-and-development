<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">Three-Layer Stack with Controller Seam</title>
  <desc>Three layers stacked top to bottom. View on top, Controller as the middle seam, Model at the foundation. A single seam mediates between view and model — the controller is the only place the two halves can meet.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
