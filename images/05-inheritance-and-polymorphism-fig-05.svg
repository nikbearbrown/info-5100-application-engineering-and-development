  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Use AI between two student-owned stages. The abstraction and the commitment belong to you.</text>

  <rect x="56" y="160" width="180" height="100" fill="#C8102E" stroke="#C8102E" stroke-width="1.5"/>
  <text x="146" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.08em">STAGE 1 · STUDENT</text>
  <text x="146" y="212" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#FFFFFF">name the abstraction</text>
  <text x="146" y="232" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">"what's common?"</text>
  <text x="146" y="248" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">"what varies?"</text>

  <path d="M 240 210 L 256 210" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="160" width="180" height="100" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">STAGE 2 · AI</text>
  <text x="350" y="212" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">propose a hierarchy</text>
  <text x="350" y="232" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">base class + subclasses,</text>
  <text x="350" y="248" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">overrides, method signatures</text>

