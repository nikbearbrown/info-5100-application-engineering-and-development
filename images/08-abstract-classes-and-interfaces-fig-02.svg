  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Object → File → Object Lifecycle</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A round trip through the file system produces a structurally equal object — not the same reference.</text>

  <rect x="40" y="140" width="120" height="64" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="100" y="162" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">CONSTRUCT</text>
  <text x="100" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">new Book(…)</text>
  <text x="100" y="198" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">on the heap</text>

  <path d="M 164 172 L 184 172" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="188" y="140" width="120" height="64" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="248" y="162" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">MUTATE</text>
  <text x="248" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">b.checkOut()</text>
  <text x="248" y="198" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">in memory only</text>

  <path d="M 312 172 L 332 172" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="336" y="140" width="120" height="64" fill="#C8102E" stroke="#C8102E" stroke-width="1.5"/>
  <text x="396" y="162" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.08em">PERSIST</text>
  <text x="396" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#FFFFFF">save(b, file)</text>
  <text x="396" y="198" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">crosses the boundary</text>

  <path d="M 460 172 L 480 172" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="484" y="140" width="120" height="64" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="544" y="162" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">LATER</text>
  <text x="544" y="184" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#2a1a0e">load(file)</text>
  <text x="544" y="198" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">→ Book b2</text>

  <rect x="240" y="260" width="220" height="80" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="284" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">KEY CONSEQUENCE</text>
  <text x="350" y="308" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">b2.equals(b) is true</text>
  <text x="350" y="328" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#C8102E">b2 == b is false</text>

  <text x="350" y="380" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Persistence preserves data, not identity. Code that relied on reference equality must change.</text>
