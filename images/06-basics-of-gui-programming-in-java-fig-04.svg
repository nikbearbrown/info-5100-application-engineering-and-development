  <title id="fig-title">Attacker Reads: Plaintext vs Hashed Storage</title>
  <desc>If credentials are stored as plaintext, an attacker who reads the database obtains every password. If credentials are stored as hashes, the same read yields only digests and a slow guessing problem. Damage drops by orders of magnitude.</desc>
