  <title id="fig-title">Event Structure with Three Registration Forms</title>
  <desc>An event has three structural parts — the source, the event object, and the handler. Three syntactic forms register the same handler: anonymous inner class, lambda, and method reference. Identical behavior, three weights of syntax.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="INFO 5100 Application Engineering and Development"
      book-slug="info-5100-application-engineering-and-development"
