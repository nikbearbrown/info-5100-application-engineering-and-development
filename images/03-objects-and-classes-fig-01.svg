  <title id="fig-title">Screen-Centric vs State-Centric Mental Model</title>
  <desc>The screen-centric view treats each screen as a separate world. The state-centric view follows one object as it persists across screens. The same Book object lives through search, result, checkout, and confirmation.</desc>
