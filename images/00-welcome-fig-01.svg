<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">JDK vs JRE Containment</title>
  <desc>Nested rectangles: the JDK contains the JRE. The JRE holds the JVM and the Class Libraries. The compiler, javac, lives inside the JDK but outside the JRE — explaining why a JRE-only install cannot compile.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="INFO 5100 Application Engineering and Development"
      book-slug="info-5100-application-engineering-and-development"
      chapter="00-welcome"
      figure-number="01"
      figure-title="JDK vs JRE Containment"
      figure-slug="jdk-vs-jre-containment"
      figure-type="structural-schematic"
      priority="Critical"
      author="Nik Bear Brown"
      date-generated="2026-05-25"
      source-file="pantry/00-welcome-cajal.md"
    />
  </metadata>
  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">JDK vs JRE Containment</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The compiler lives in the JDK but not the JRE — install the JRE alone and you cannot compile.</text>

  <!-- JDK outer rectangle -->
  <rect x="120" y="100" width="460" height="260" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="136" y="124" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">JDK</text>
  <text x="170" y="124" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">— Java Development Kit</text>

  <!-- JRE inner rectangle -->
  <rect x="140" y="160" width="280" height="180" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="156" y="184" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">JRE</text>
  <text x="190" y="184" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">— Runtime Environment</text>

  <!-- JVM box inside JRE -->
  <rect x="160" y="220" width="116" height="92" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
  <text x="218" y="262" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#FFFFFF">JVM</text>
  <text x="218" y="282" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.06em">runs bytecode</text>

  <!-- Class Libraries box inside JRE -->
  <rect x="284" y="220" width="120" height="92" fill="#2a1a0e" stroke="#2a1a0e" stroke-width="1"/>
  <text x="344" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#FFFFFF">Class</text>
  <text x="344" y="274" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#FFFFFF">Libraries</text>
  <text x="344" y="292" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.06em">java.util, java.io …</text>

  <!-- javac box inside JDK but outside JRE -->
  <rect x="450" y="200" width="110" height="84" fill="#C8102E" stroke="#C8102E" stroke-width="1"/>
  <text x="505" y="240" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#FFFFFF">javac</text>
  <text x="505" y="258" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.06em">the compiler</text>

  <!-- Annotation: javac sits inside JDK, outside JRE -->
  <text x="505" y="312" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#C8102E">inside JDK</text>
  <text x="505" y="328" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#C8102E">outside JRE</text>

  <!-- Footer -->
  <text x="350" y="392" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A JRE-only install can run a .class file. It cannot make one.</text>
</svg>
