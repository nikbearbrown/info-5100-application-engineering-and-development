  <title id="fig-title">Write Path vs Read Path with Failure Points</title>
  <desc>The write path moves an object from memory through serialization, the file system, and disk. The read path runs the reverse. Each transition is a place a write or read can fail — the failures appear at exactly mirrored positions on the two paths.</desc>
