  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Handler Responsibility Decomposition</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A clean handler does exactly four things. Anything else is leakage.</text>

  <rect x="48" y="160" width="140" height="80" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="118" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">1 · VALIDATE</text>
  <text x="118" y="208" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">guard the input</text>
  <text x="118" y="228" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">isbn nonempty?</text>

  <path d="M 192 200 L 220 200" stroke="#2a1a0e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="224" y="160" width="140" height="80" fill="#C8102E" stroke="#C8102E" stroke-width="1.5"/>
  <text x="294" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF" letter-spacing="0.08em">2 · ONE MODEL CALL</text>
  <text x="294" y="208" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#FFFFFF">one method, no more</text>
  <text x="294" y="228" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#FFFFFF">loans.record(p, b)</text>

