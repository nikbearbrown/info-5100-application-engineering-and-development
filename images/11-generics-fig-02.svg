  <text x="616" y="210" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">done</text>

  <text x="350" y="292" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">EVERYTHING ELSE BELONGS SOMEWHERE ELSE</text>
  <text x="350" y="318" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="12" fill="#2a1a0e">business rules → model · formatting → view · persistence → save() · logging → infrastructure</text>

  <text x="350" y="372" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A handler is a thin seam, not a place to hide other layers' work.</text>
