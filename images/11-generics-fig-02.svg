  <rect x="400" y="160" width="140" height="80" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="470" y="184" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">3 · UPDATE VIEW</text>
  <text x="470" y="208" text-anchor="middle" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="13" fill="#2a1a0e">reflect new state</text>
  <text x="470" y="228" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">label.setText(...)</text>

