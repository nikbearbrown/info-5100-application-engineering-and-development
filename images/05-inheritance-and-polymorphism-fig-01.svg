  <title id="fig-title">Supply-Coupled vs Preloaded Construction</title>
  <desc>Two construction strategies for a catalog. Supply-coupled builds new domain objects on every checkout, conflating supply with transaction. Preloaded builds the catalog once and reuses it; transactions never construct domain objects.</desc>
