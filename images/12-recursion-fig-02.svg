  <title id="fig-title">FXMLLoader Injection — Match vs Mismatch</title>
  <desc>The FXMLLoader inspects fx:id values in FXML and finds @FXML-annotated fields in the controller with matching names. A match wires them. A mismatch — a typo or rename on either side — leaves the controller field null with no compile error.</desc>
