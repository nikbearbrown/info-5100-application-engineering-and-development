  <title id="fig-title">Three-Layer Responsibility Model</title>
  <desc>Three layers separate responsibility: visibility controls which screen is shown, display turns state into pixels, and state is the persistent object data. Each layer asks one question; each is allowed to know only about the layer below it.</desc>
