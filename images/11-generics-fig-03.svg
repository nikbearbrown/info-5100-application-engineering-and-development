<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="fig-title">
  <title id="fig-title">Closet Handler vs Clean Handler</title>
  <desc>The closet handler accumulates responsibilities until it does seven things in one method. The clean handler does the same task in four lines because the other six responsibilities live where they belong.</desc>
  <metadata>
    <cajal:figure
      xmlns:cajal="https://bearbrown.ai/cajal/1.0"
      book="INFO 5100 Application Engineering and Development"
      book-slug="info-5100-application-engineering-and-development"
