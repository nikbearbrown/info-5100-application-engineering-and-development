  <title id="fig-title">Dynamic Dispatch</title>
  <desc>A reference of compile-time type Vehicle holds an object of runtime type Bicycle. When .move() is called, the JVM consults the runtime type and dispatches to Bicycle.move() — not the type the variable was declared with.</desc>
