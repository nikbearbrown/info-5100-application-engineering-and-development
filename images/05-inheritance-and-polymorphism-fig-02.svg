  <rect x="0" y="0" width="700" height="420" fill="#FFFFFF"/>

  <text x="32" y="36" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Catalog Class Boundary</text>
  <text x="32" y="56" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">State stays inside. Methods sit on the boundary. Everything else has no business knowing how the Catalog is built.</text>

  <rect x="120" y="100" width="460" height="260" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <text x="140" y="124" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" fill="#2a1a0e">Catalog</text>

  <rect x="160" y="148" width="380" height="80" fill="#F5F5F5" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="170" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">INTERNAL STATE — PRIVATE</text>
  <text x="350" y="196" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">List&lt;Book&gt; books</text>
  <text x="350" y="216" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">Map&lt;String, Author&gt; authors</text>

  <rect x="160" y="244" width="380" height="92" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="350" y="266" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">PUBLIC INTERFACE</text>
  <text x="350" y="292" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">findBook(String isbn)</text>
  <text x="350" y="310" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">findAuthor(String name)</text>
  <text x="350" y="328" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12" fill="#2a1a0e">size(), contains(...)</text>

  <text x="350" y="396" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Outside this boundary, no caller may touch books, authors, or any choice about storage shape.</text>
